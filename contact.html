<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="images/icon-32.png" sizes="32x32">
<link rel="icon" href="images/icon-512.png" sizes="512x512">

</head>
<body>

<div class="brand">
  <a class="brand__link" href="index.html">
    <img class="logo" src="images/wordmark.png" alt="Meighan Lindstrom Art" width="841" height="362" decoding="async">
  </a>
</div>

<header class="bar">
  <div class="bar__l"></div>
  <div class="bar__c"></div>
  <nav class="bar__r" aria-label="Primary">
    <a class="navlink" href="index.html">Prints</a>
    <a class="navlink" href="about.html">About</a>
    <a class="navlink" href="contact.html" aria-current="page">Contact</a>
  </nav>
  <button class="burger" aria-label="Menu" aria-expanded="false">Menu</button>
</header>

<nav class="menu" aria-label="Menu">
  <a href="index.html">Prints</a>
  <a href="about.html">About</a>
  <a href="contact.html" aria-current="page">Contact</a>
</nav>

<main class="page">

  <div class="block" style="padding-top:clamp(40px,9vh,90px)">

    <!-- The lede was deleted at Meighan's request; the page still needs a
         heading, so this one carries it without putting copy back. -->
    <h1 class="sr-only">Contact Meighan Lindstrom</h1>

    <div class="cols">

      <div>
        <form class="form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
          <input type="hidden" name="form-name" value="contact">
          <p style="display:none"><label>Leave blank <input name="bot-field"></label></p>

          <div class="field">
            <label class="micro" for="name">Name</label>
            <input id="name" name="name" type="text" required>
          </div>

          <div class="field">
            <label class="micro" for="email">Email</label>
            <input id="email" name="email" type="email" required>
          </div>

          <div class="field">
            <label class="micro" for="subject">Subject</label>
            <span class="select-wrap">
            <select id="subject" name="subject">
              <option>A print</option>
              <option>An original</option>
              <option>A commission</option>
              <option>Hand lettering</option>
              <option>Licensing</option>
              <option>Saying hello</option>
            </select>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6"/></svg>
            </span>
          </div>

          <div class="field">
            <label class="micro" for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>

          <button class="submit" type="submit">Send</button>
        </form>
      </div>

      <div>
        <div class="row">
          <div class="row__k micro">Email</div>
          <div class="row__v"><a class="mailto" href="mailto:meighanlindstrom@gmail.com">meighanlindstrom@gmail.com</a></div>
        </div>
        <div class="row">
          <div class="row__k micro">Instagram</div>
          <div class="row__v"><a class="mailto" href="https://www.instagram.com/meighanlindstromart/" rel="me noopener">@meighanlindstromart</a></div>
        </div>

        <figure class="plate" style="margin-top:48px">
          <img src="images/thumb/flowers-vase-yellow.jpg" alt="I'll Be Your Flowers — drawing by Meighan Lindstrom" width="714" height="1000" loading="lazy" decoding="async">
          <figcaption>I'll Be Your Flowers</figcaption>
        </figure>
      </div>

    </div>
  </div>

</main>

<footer class="foot">
  <span>Meighan Lindstrom Art</span>
  <a href="https://www.instagram.com/meighanlindstromart/" rel="me noopener">@meighanlindstromart</a>
  <a href="mailto:meighanlindstrom@gmail.com">meighanlindstrom@gmail.com</a>
  <span class="foot__end micro">© <span id="yr">2026</span></span>
</footer>

<script src="js/works.js"></script>
<script src="js/main.js"></script>
</body>
</html>
